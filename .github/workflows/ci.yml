name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v5
        with:
          path: ~/.bundle
          key: bundle-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: bundle-${{ runner.os }}-
      - run: bundle install
      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v5
        with:
          path: ~/.bundle
          key: bundle-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: bundle-${{ runner.os }}-
      - run: bundle install
      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('mise.toml', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-
      - name: Lint code for consistent style
        run: bin/rubocop -f github

  build_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - uses: actions/cache@v5
        with:
          path: ~/.bundle
          key: bundle-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: bundle-${{ runner.os }}-
      - run: npm ci
      - run: bundle install
      - name: Type-check frontend
        run: npx tsc --noEmit
      - name: Build frontend assets
        run: bundle exec rake vite:build

  test_frontend_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - name: Run Vitest unit tests
        run: npm run test:unit

  test_frontend_storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - name: Install Playwright Chromium
        run: |
          PW_VERSION="$(ruby -e "puts File.read('Gemfile.lock')[/playwright-ruby-client \((.+?)\)/, 1]")"
          echo "Installing chromium for playwright@${PW_VERSION}"
          npx -y "playwright@${PW_VERSION}" install --with-deps chromium
      - name: Run Storybook tests
        run: npm run test:storybook

  test_backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: looking_for_job
          POSTGRES_PASSWORD: looking_for_job
          POSTGRES_DB: looking_for_job_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd="pg_isready -U looking_for_job"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - '6379:6379'
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      meilisearch:
        image: getmeili/meilisearch:latest
        ports:
          - '7700:7700'
        env:
          MEILI_MASTER_KEY: masterKey
        options: >-
          --health-cmd="wget -q --spider http://127.0.0.1:7700/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: looking_for_job
      DB_PASSWORD: looking_for_job
      MEILISEARCH_API_KEY: masterKey
      MEILISEARCH_URL: http://127.0.0.1:7700
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v5
        with:
          path: ~/.bundle
          key: bundle-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: bundle-${{ runner.os }}-
      - run: bundle install
      - run: npx playwright install --with-deps chromium
      - name: Prepare test database
        run: bundle exec rails db:prepare
      - name: Run RSpec
        run: bundle exec rspec
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
